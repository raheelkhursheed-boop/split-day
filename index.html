<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181c22" media="(prefers-color-scheme: dark)">
<meta name="description" content="A 5-day hypertrophy split for the gym: pick an option per slot, see a demo, log your weight.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split Day">
<title>Split Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, sticky day bar on top, one card per slot. Day colors follow competition plate colors. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ed; --fg:#14181d; --muted:#5b6672; --line:#d6dce3;
  --accent:#1f5fbf; --accent-fg:#ffffff; --ok:#2f9e55; --warn:#d9a514; --bad:#d6332f;
  --p1:#d6332f; --p2:#1f5fbf; --p3:#d9a514; --p4:#2f9e55; --p5:#f7f8fa; --p5-line:#9aa5b1;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#181c22; --sunk:#222831; --fg:#e9edf1; --muted:#9aa5b1; --line:#2b323b;
  --accent:#5b97f2; --accent-fg:#0b1220; --ok:#46b86c; --warn:#e7b416; --bad:#e5534b; --p5:#e9edf1; --p5-line:#e9edf1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#181c22; --sunk:#222831; --fg:#e9edf1; --muted:#9aa5b1; --line:#2b323b;
  --accent:#5b97f2; --accent-fg:#0b1220; --ok:#46b86c; --warn:#e7b416; --bad:#e5534b; --p5:#e9edf1; --p5-line:#e9edf1; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.unit{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.unit button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 12px;cursor:pointer}
.unit button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px var(--body)}
.days button .plate{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--display);color:#fff;border:2px solid transparent}
.days button[data-d="5"] .plate{color:#14181d;border-color:var(--p5-line)}
.days button[aria-current="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.days button .up{font-size:10px;color:var(--accent);height:12px;line-height:12px;text-transform:uppercase;letter-spacing:.06em}
main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
.dayhead h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.dayhead p{margin:4px 0 0;color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.done{border-color:var(--ok)}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 8px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.slot{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;text-transform:uppercase}
.sr{font:600 14px var(--body);white-space:nowrap;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opt{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 10px 6px 6px;font:500 13px var(--body);cursor:pointer;display:flex;align-items:center;gap:6px;max-width:240px}
.opt span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.eq{font:700 10px var(--body);letter-spacing:.04em;border-radius:999px;padding:2px 6px;background:var(--sunk);color:var(--muted)}
.opt[aria-pressed="true"] .eq{background:var(--bg);color:var(--fg)}
.media{position:relative;background:#fff;aspect-ratio:3/2;max-width:100%;display:grid;place-items:center;border-block:1px solid var(--line)}
.media img{width:100%;height:100%;object-fit:contain;display:block}
.media .none{color:#5b6672;font-size:13px;padding:20px;text-align:center}
.media .tag{position:absolute;left:8px;bottom:8px;background:rgba(20,24,29,.78);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.exname{font-weight:600;font-size:16px}
.log{display:flex;align-items:stretch;gap:8px}
.step{flex:1;min-width:0;display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.step button{flex:none;width:44px;border:0;background:none;color:var(--fg);font:600 22px var(--body);cursor:pointer}
.step button:active{background:var(--sunk)}
.step label{flex:1;min-width:0;display:flex;justify-content:flex-end;align-items:baseline;gap:4px;padding:0 4px;border-inline:1px solid var(--line)}
.step input{width:100%;min-width:0;border:0;background:none;color:var(--fg);font:700 26px var(--display);text-align:right;padding:8px 0;font-variant-numeric:tabular-nums}
.step input:focus{outline:none}
.step .u{font-size:13px;color:var(--muted);padding-right:6px}
.donebtn{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:12px 14px;font:600 14px var(--body);cursor:pointer;min-height:48px}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.last b{color:var(--fg);font-weight:600}
details{font-size:14px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
details ol{margin:8px 0 0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.finish{border:0;border-radius:14px;padding:16px;background:var(--accent);color:var(--accent-fg);font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.note{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
 .edit{border:0;background:none;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:4px 0}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.editor{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.erow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.erow .t{flex:1;min-width:0;font-size:14px}
.erow button{border:0;background:none;color:var(--muted);font:600 18px var(--body);width:32px;height:32px;cursor:pointer;border-radius:8px}
.erow button:active{background:var(--sunk)}
.addrow{display:flex;gap:6px}
.addrow input,.addrow select{min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px;font:500 15px var(--body)}
.addrow input{flex:1}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 14px;font:600 14px var(--body);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.erow2{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.backup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.backup textarea{width:100%;min-height:90px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:12px ui-monospace,Menlo,monospace;padding:8px}
.backup .erow2{margin-top:8px}
.backup p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.days{grid-template-columns:repeat(7,1fr)!important;gap:4px!important}
.days button{padding:5px 0 6px!important;border-radius:9px!important}
.days .dow{font-size:11px;font-weight:600;color:var(--muted)}
.days button[aria-current="true"] .dow{color:var(--fg)}
.days .plate.alt{background:var(--sunk);color:var(--fg);font-size:12px}
.sect{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.sect h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.05}
.snote{margin:0;font-size:13px;color:var(--muted)}
.snote.in{margin:0}
.rx{font-size:14px;font-weight:600;color:var(--accent)}
.donebtn.wide{flex:1}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rec.r-g{border-color:var(--ok)}.rec.r-m{border-color:var(--warn)}.rec.r-l{border-color:var(--bad)}
.rec p{margin:0;font-size:14px}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rnote{font-size:11px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 4px;font:600 13px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.rec.r-g .seg button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.rec.r-m .seg button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1a1300}
.rec.r-l .seg button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
details.moved{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
details.moved[open]>*+*{margin-top:12px}
details.moved summary{font:600 14px var(--body);color:var(--muted);cursor:pointer}
.restcard .body{gap:6px}
.sets{display:flex;flex-direction:column;gap:6px}
.shead,.srow{display:grid;grid-template-columns:20px minmax(0,1fr) 56px 44px;gap:6px;align-items:center}
.shead{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.snum{font:700 18px var(--display);color:var(--muted);text-align:center}
.step.sm button{width:38px;font-size:20px}
.step.sm input{font-size:22px;text-align:center;padding:6px 0}
.step.sm label{justify-content:center}
.reps::placeholder{color:var(--muted);font-size:16px;opacity:.8}
.reps{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:700 22px var(--display);text-align:center;padding:6px 0;font-variant-numeric:tabular-nums;height:100%}
.tick{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:12px;font:700 18px var(--body);cursor:pointer;min-height:44px}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.srow.sdone .step,.srow.sdone .reps{border-color:var(--ok)}
.rounds{display:flex;align-items:center;gap:8px}
.rounds .rl{font-size:13px;font-weight:600;color:var(--muted);margin-right:auto}
.tick.big{width:56px;font:700 18px var(--display)}
.restlbl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--fg);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.rest .rbar{height:4px;background:color-mix(in srgb,var(--bg) 25%,transparent)}
.rest .rbar i{display:block;height:100%;width:0;background:var(--accent)}
.rest .rin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest .rtxt{flex:1;min-width:0}
.rest .eyebrow{color:inherit;opacity:.7}
.rtime{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.rlab{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:none;color:inherit;border-radius:10px;min-width:48px;min-height:44px;font:600 14px var(--body);cursor:pointer}
.rest button.skip{background:var(--bg);color:var(--fg)}
.rest.over{background:var(--ok);color:#fff}
.rest.over .rbar i{background:#fff}
body.resting main .wrap{padding-bottom:120px}
.sharebtn{min-height:48px;font-size:15px}
.sharebox{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:13px/1.5 ui-monospace,Menlo,monospace;padding:10px}
.prog{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--bg)}
.prog .ptxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.prog b{font-size:14px;color:var(--fg)}
.prog.p-up{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.prog.p-up b{color:var(--ok)}
.prog.p-hold{border-color:var(--warn)}
.btn.apply{flex:none;background:var(--ok);border-color:var(--ok);color:#fff;white-space:nowrap}
.hist summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.sparkwrap{margin-top:8px}
.spark{width:100%;height:70px;display:block}
.spark .sl{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .sa{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:none}
.spark .sd{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.sax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.hlist li{display:flex;gap:10px}
.hlist .hd{width:56px;flex:none;color:var(--muted)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="toprow">
      <div class="brand">Split Day</div>
      <div class="unit" role="group" aria-label="Weight unit">
        <button id="u-kg" type="button" data-u="kg">kg</button>
        <button id="u-lb" type="button" data-u="lb">lb</button>
      </div>
    </div>
    <nav class="days" id="days" aria-label="Training day"></nav>
  </div>
</header>
<main><div class="wrap" id="main"><p class="note">Loading your plan…</p></div></main>
<div class="toast" id="toast" hidden></div>
<div class="rest" id="rest" hidden role="timer" aria-live="off">
  <div class="rbar"><i id="rest-bar"></i></div>
  <div class="rin">
    <div class="rtxt"><div class="eyebrow">Rest</div><div class="rtime" id="rest-time">0:00</div><div class="rlab" id="rest-label"></div></div>
    <button type="button" id="rest-minus" onclick="adjustRest(-15)" aria-label="Subtract 15 seconds">−15</button>
    <button type="button" id="rest-plus" onclick="adjustRest(15)" aria-label="Add 15 seconds">+15</button>
    <button type="button" id="rest-skip" class="skip" onclick="stopRest()">Skip</button>
  </div>
</div>

<script>
const PLATES=['var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--p5)'];
const EQ={M:'Machine',C:'Cable',FW:'Free weight'};
const DOW_FULL={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
let DATA=null;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const todayIdx=()=>(new Date().getDay()+6)%7;
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80);
const fmtDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const LS='splitday.v1';
const BLANK=()=>({v:2,ts:0,unit:'kg',lastDay:0,sel:{},w:{},done:{},hist:{},custom:{},rec:{}});

let S=BLANK();
try{const r=localStorage.getItem(LS);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.custom)S.custom={}; if(!S.rec)S.rec={};
let view=todayIdx();

function save(){S.ts=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save on this device')}}
const editing=new Set();
const stepFor=log=>log==='min'?5:(S.unit==='kg'?2.5:5);
const unitFor=log=>log==='min'?'min':S.unit;
const exKey=(o,log)=>(log==='min'?'min:':'')+slug(o.n);
function lastEntry(k){const h=S.hist[k]||[];const t=today();for(let i=h.length-1;i>=0;i--)if(h[i][0]!==t)return h[i];return null}
function setUnit(u){
  if(u===S.unit)return;
  const f=u==='lb'?2.20462:1/2.20462, r=u==='lb'?5:2.5;
  for(const k in S.w)if(!k.startsWith('min:'))S.w[k]=Math.round(S.w[k]*f/r)*r;
  const cv=w=>w==null?w:Math.round(w*f/r)*r;
  for(const k in S.hist)if(!k.startsWith('min:'))S.hist[k]=S.hist[k].map(e=>e[2]?[e[0],cv(e[1]),e[2].map(x=>[cv(x[0]),x[1]])]:[e[0],cv(e[1])]);
  for(const d in (S.sets||{}))for(const id in S.sets[d]){const v=S.sets[d][id];if(Array.isArray(v)&&v.length&&typeof v[0]==='object')v.forEach(x=>x.w=cv(x.w))}
  S.unit=u;save();render();
}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!=null)e.setAttribute(k,attrs[k])}for(const c of kids)if(c!=null)e.append(c);return e};


/* ---------- rest timer ---------- */
function restFor(s){
  if(s.log==='none')return 25;
  if(/^Abs/.test(s.m))return 60;
  const lo=parseInt((s.sr.match(/×\s*(\d+)/)||[])[1]||'10',10);
  return lo<=6?150:lo<=8?120:75;
}
const fmtT=x=>{x=Math.max(0,Math.ceil(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
let T={end:0,total:0,label:'',iv:null,ac:null};
function beep(){try{const ac=T.ac;if(!ac)return;[0,0.25,0.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(0.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.3,ac.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.18);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.2)})}catch(e){}}
function startRest(sec,label){
  try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();T.ac.resume&&T.ac.resume()}catch(e){}
  T.total=sec;T.end=Date.now()+sec*1000;T.label=label;
  try{sessionStorage.setItem('splitday.rest',JSON.stringify({end:T.end,total:T.total,label}))}catch(e){}
  tick();clearInterval(T.iv);T.iv=setInterval(tick,250);
}
function stopRest(){clearInterval(T.iv);T.end=0;document.getElementById('rest').hidden=true;document.body.classList.remove('resting');try{sessionStorage.removeItem('splitday.rest')}catch(e){}}
function tick(){
  const box=document.getElementById('rest');
  if(!T.end){box.hidden=true;return}
  const left=(T.end-Date.now())/1000;
  box.hidden=false;document.body.classList.add('resting');
  document.getElementById('rest-label').textContent=T.label;
  const tEl=document.getElementById('rest-time');
  const bar=document.getElementById('rest-bar');
  if(left<=0){
    if(!box.classList.contains('over')){box.classList.add('over');try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}beep()}
    tEl.textContent='Go';bar.style.width='100%';
    if(left<-8)stopRest();
    return;
  }
  box.classList.remove('over');
  tEl.textContent=fmtT(left);
  bar.style.width=(100*(1-left/T.total))+'%';
}
function adjustRest(d){if(!T.end)return;if(T.end<Date.now())T.end=Date.now();T.end+=d*1000;T.total=Math.max(T.total+d,1);document.getElementById('rest').classList.remove('over');tick()}
try{const r=JSON.parse(sessionStorage.getItem('splitday.rest')||'null');if(r&&r.end>Date.now()){T.end=r.end;T.total=r.total;T.label=r.label;T.iv=setInterval(tick,250)}}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});



/* ---------- progression ---------- */
function repRange(sr){const m=sr.match(/×\s*(\d+)\s*[–-]\s*(\d+)/);return m?[+m[1],+m[2]]:null}
function progressFor(s,k){
  const le=lastEntry(k);if(!le||!le[2]||!le[2].length)return null;
  const rr=repRange(s.sr);if(!rr)return null;
  const [lo,hi]=rr, sets=le[2], top=Math.max(...sets.map(x=>x[0]||0));
  const inc=S.unit==='kg'?(lo<=8?2.5:1):(lo<=8?5:2.5);
  const full=sets.length>=3&&sets.every(x=>(x[1]||0)>=hi&&(x[0]||0)>=top);
  if(full)return{kind:'up',w:Math.round((top+inc)*100)/100,inc,msg:'You hit '+hi+' reps on all 3 sets last time.'};
  const low=sets.filter(x=>x[1]!=null&&x[1]<lo).length;
  if(low>=2)return{kind:'hold',w:top,msg:'Most sets fell below '+lo+' reps. Stay at '+top+' '+S.unit+' (or drop a step) until you reach '+lo+'+.'};
  const best=Math.max(...sets.filter(x=>(x[0]||0)>=top).map(x=>x[1]||0));
  return{kind:'build',w:top,msg:'Stay at '+top+' '+S.unit+'. Add reps until all 3 sets reach '+hi+' (best last time: '+best+').'};
}
function histBox(k){
  const h=(S.hist[k]||[]).filter(e=>e[2]&&e[2].length);
  if(!h.length)return null;
  const pts=h.slice(-12).map(e=>Math.max(...e[2].map(x=>x[0]||0)));
  let svg=null;
  if(pts.length>1){
    const W=300,H=70,P=6,mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;
    const xy=pts.map((v,i)=>[P+i*(W-2*P)/(pts.length-1),H-P-(v-mn)/rg*(H-2*P)]);
    const ns='http://www.w3.org/2000/svg';svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','spark');svg.setAttribute('role','img');svg.setAttribute('aria-label','Top weight trend from '+pts[0]+' to '+pts[pts.length-1]+' '+S.unit);
    const area=document.createElementNS(ns,'path');area.setAttribute('d','M'+xy.map(p=>p.join(',')).join(' L')+' L'+xy[xy.length-1][0]+','+(H-P)+' L'+xy[0][0]+','+(H-P)+' Z');area.setAttribute('class','sa');svg.append(area);
    const ln=document.createElementNS(ns,'polyline');ln.setAttribute('points',xy.map(p=>p.join(',')).join(' '));ln.setAttribute('class','sl');svg.append(ln);
    const c=document.createElementNS(ns,'circle');c.setAttribute('cx',xy[xy.length-1][0]);c.setAttribute('cy',xy[xy.length-1][1]);c.setAttribute('r','4');c.setAttribute('class','sd');svg.append(c);
  }
  const ul=el('ul',{class:'hlist'});
  h.slice(-8).reverse().forEach(e=>ul.append(el('li',{},el('span',{class:'hd'},fmtDate(e[0])),el('span',{},e[2].map(x=>x[0]+'×'+(x[1]??'?')).join(', ')))));
  const first=pts[0],last=pts[pts.length-1],diff=Math.round((last-first)*100)/100;
  return el('details',{class:'hist'},el('summary',{},'History · '+h.length+' session'+(h.length>1?'s':'')+(pts.length>1&&diff?' · '+(diff>0?'+':'')+diff+' '+S.unit:'')),
    svg?el('div',{class:'sparkwrap'},svg,el('div',{class:'sax'},el('span',{},Math.min(...pts)+' '+S.unit),el('span',{},Math.max(...pts)+' '+S.unit))):null,ul);
}

/* ---------- share today's workout ---------- */
function allSlots(){
  const out=[];
  DATA.days.forEach(d=>d.slots.forEach((s,i)=>out.push({id:'d'+d.day+'s'+i,s,day:d})));
  DATA.week.forEach(w=>w.extras.forEach(x=>x.slots.forEach((s,i)=>out.push({id:'x-'+x.key+'-'+i,s,x}))));
  out.push({id:'x-z2swap-0',s:DATA.z2swap,swap:true});
  return out;
}
function buildSummary(){
  const t=today(), sets=(S.sets||{})[t]||{}, dn=S.done[t]||{}, lines=[];
  const dt=new Date();const w=DATA.week[todayIdx()];
  const recTxt={g:'65% or higher',m:'50–64%',l:'under 50%'}[S.rec[t]];
  let liftDays=new Set();
  const body=[];
  allSlots().forEach(({id,s,day})=>{
    const log=s.log||'kg';const OPTS=S.custom[id]||s.o;const o=OPTS[S.sel[id]??0]||OPTS[0];const nm=o.n.split(' · ')[0];
    const label=s.m+' · '+s.s;
    if(log==='kg'){
      const rows=(sets[id]||[]).filter(r=>r&&r.d);
      if(!rows.length)return;
      if(day)liftDays.add(day.day);
      body.push(label+': '+nm,'   '+rows.map(r=>(r.w??0)+' '+S.unit+' × '+(r.r??'?')).join(', ')+(rows.length<3?'  ('+rows.length+' of 3 sets)':''));
    }else if(log==='min'){
      if(!dn[id])return;
      const h=(S.hist[exKey(o,log)]||[]).slice(-1)[0];
      body.push(label+': '+nm+(h&&h[0]===t?' · '+h[1]+' min':''));
    }else{
      const r=sets[id];
      if(Array.isArray(r)&&r.length&&typeof r[0]==='boolean'){const n=r.filter(Boolean).length;if(!n)return;body.push(label+': '+nm+' · '+n+' of '+r.length+' rounds')}
      else if(dn[id])body.push(label+': '+o.n+' ✓');
    }
  });
  const days=[...liftDays].map(n=>'Day '+n+' — '+DATA.days[n-1].name);
  lines.push('Split Day · '+dt.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'}));
  lines.push(days.length?days.join(' + '):(w.lift?'Day '+w.lift+' — '+DATA.days[w.lift-1].name:w.name));
  if(recTxt)lines.push('Recovery: '+recTxt);
  lines.push('');
  if(body.length)lines.push(...body);else lines.push('Nothing logged yet today.');
  return {text:lines.join('\n'),empty:!body.length};
}
async function shareToday(){
  const {text,empty}=buildSummary();
  if(empty){toast('Log at least one set first');return}
  try{if(navigator.share){await navigator.share({title:'Today\'s workout',text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Copied. Paste it to your trainer.');return}catch(e){}
  const ta=document.getElementById('share-text');ta.value=text;ta.hidden=false;ta.select();toast('Select all and copy');
}

/* ---------- render ---------- */
function render(){
  if(!DATA)return;
  renderDays();

  const m=document.getElementById('main');m.textContent='';

    el('div',{class:'eyebrow'},DOW_FULL[w.dow]+(d?' · Day '+d.day+' of 5':'')),
    el('h1',{},d?d.name:w.name),

  m.append(head);
  if(w.dow==='Sun'){
    m.append(el('section',{class:'card restcard'},el('div',{class:'body'},
      el('div',{class:'slot'},'Full rest'),
      el('p',{class:'last'},'No lifting and no cardio today. If Thursday\'s Zone 2 got skipped because your legs felt heavy, you can do it today instead.'))));
    m.append(backupBox());m.append(credits());return;
  }
  if(view===todayIdx())m.append(recoveryCard(w));
  // Low recovery on a lift day: Zone 2 replaces the lift
  const swapLift=d&&r==='l';
  if(swapLift){

  }

    if(!swapLift)m.append(sectHead('Lifting',d.name));
    d.slots.forEach((s,i)=>{const id='d'+d.day+'s'+i;if(!swapLift)tracked.push(id);liftWrap.append(slotCard(id,s,dn))});
    if(w.absNote)liftWrap.append(el('p',{class:'snote'},w.absNote));
    if(swapLift)m.append(liftWrap);
  }
  w.extras.forEach(x=>{
    if(x.kind==='finisher'){
      m.append(sectHead('Optional · 8–12 min',x.title));
      if(r==='m'||r==='l'){m.append(el('p',{class:'snote'},'Skip it today. Finishers are only for days when recovery is 65% or higher.'));return}
      if(swapLift)return;
      m.append(el('p',{class:'snote'},'Only on days when recovery is 65% or higher.'));
      x.slots.forEach((s,i)=>m.append(slotCard('x-'+x.key+'-'+i,s,dn)));
      return;
    }
    if(x.kind==='intervals'&&(r==='m'||r==='l')){

    }
    if(swapLift&&x.kind==='cardio')return;
    m.append(sectHead(x.kind==='abs'?'About 10 min after lifting':x.kind==='cardio'?'After lifting':'Cardio',x.title));
    x.slots.forEach((s,i)=>{const id='x-'+x.key+'-'+i;tracked.push(id);m.append(slotCard(id,s,dn))});
  });
  const doneCount=tracked.filter(id=>dn[id]).length;

  head.append(el('div',{class:'progress'},el('div',{class:'bar'},bar),el('span',{},doneCount+' / '+tracked.length+' done today')));
  m.append(el('button',{class:'finish',type:'button',onclick:finishDay},'Finish '+DOW_FULL[w.dow]));

    const box=el('div',{class:'rounds'},el('span',{class:'rl'},'Rounds'));
    rows.forEach((d,i)=>box.append(el('button',{type:'button',class:'tick big','aria-pressed':String(d),'aria-label':'Round '+(i+1),onclick:()=>{
      rows[i]=!rows[i];S.sets[t0][id]=rows;if(rows[i]){const nx=rows.findIndex(x=>!x);startRest(restFor(s),nx>=0?'Next: round '+(nx+1)+' · '+nm:'Next exercise')}S.done[t0]=S.done[t0]||{};if(rows.every(Boolean))S.done[t0][id]=true;else delete S.done[t0][id];pruneDone();save();render()}},String(i+1))));
    body.append(box);
  }else if(log==='none'){
    body.append(el('div',{class:'log'},doneBtn()));
  }else{
    const u=unitFor(log);
    const inp=el('input',{id:'w-'+id,type:'number',inputmode:'decimal',step:'any',min:'0','aria-label':'Minutes for '+nm,placeholder:'0',value:S.w[k]!=null?String(S.w[k]):''});
    const cur=()=>parseFloat(inp.value)||0;
    const setW=v=>{v=Math.max(0,Math.round(v*100)/100);inp.value=String(v);S.w[k]=v;if(dn[id])logHist(k,v);save()};
    inp.addEventListener('change',()=>{const v=parseFloat(inp.value);if(isNaN(v)){delete S.w[k];save()}else setW(v)});
    body.append(el('div',{class:'log'},
      el('div',{class:'step'},
        el('button',{type:'button','aria-label':'Decrease',onclick:()=>setW(cur()-stepFor(log))},'−'),
        el('label',{for:'w-'+id},inp,el('span',{class:'u'},u)),
        el('button',{type:'button','aria-label':'Increase',onclick:()=>setW(cur()+stepFor(log))},'+')),
      doneBtn(()=>{if(inp.value!=='')logHist(k,cur())})));
    const le=lastEntry(k);
    body.append(el('div',{class:'last'},...(le?['Last time: ',el('b',{},le[1]+' '+u),' on '+fmtDate(le[0])]:['Set your minutes and tap Mark done to log it.'])));
  }
  const st=o.img&&!o.ap&&DATA.steps[o.img];
  if(st){const ol=el('ol');st.forEach(x=>ol.append(el('li',{},x)));body.append(el('details',{},el('summary',{},'How to do it'),ol))}
  card.append(body);
  return card;
}
function rerender(card,id,s){const n=slotCard(id,s,S.done[today()]||{});card.replaceWith(n);return n}
function editCard(id,s,OPTS){
  const card=el('article',{class:'card'});
  const list=OPTS.slice();
  card.append(el('div',{class:'chead'},el('div',{},el('div',{class:'eyebrow'},s.m+' · editing'),el('div',{class:'slot'},s.s)),el('div',{class:'sr'},s.sr)));
  const ed=el('div',{class:'editor'});
  const commit=()=>{S.custom[id]=list.slice();const cur=S.sel[id]??0;if(cur>=list.length)S.sel[id]=0;save()};
  list.forEach((op,j)=>ed.append(el('div',{class:'erow'},el('span',{class:'eq'},op.eq),el('span',{class:'t'},op.n),
    el('button',{type:'button','aria-label':'Move up',disabled:j===0?'':null,onclick:()=>{[list[j-1],list[j]]=[list[j],list[j-1]];const sv=S.sel[id]??0;if(sv===j)S.sel[id]=j-1;else if(sv===j-1)S.sel[id]=j;commit();rerender(card,id,s)}},'↑'),
    el('button',{type:'button','aria-label':'Remove '+op.n,onclick:()=>{if(list.length<=1){toast('Keep at least one option');return}list.splice(j,1);const sv=S.sel[id]??0;if(sv===j)S.sel[id]=0;else if(sv>j)S.sel[id]=sv-1;commit();rerender(card,id,s)}},'×'))));
  const nm=el('input',{id:'add-'+id,type:'text',placeholder:'Add an exercise',maxlength:'60','aria-label':'New exercise name'});
  const eq=el('select',{id:'eq-'+id,'aria-label':'Equipment'},el('option',{value:'M'},'M'),el('option',{value:'C'},'C'),el('option',{value:'FW'},'FW'));
  const add=()=>{const v=nm.value.trim();if(!v)return;list.push({n:v,eq:eq.value});commit();const n=rerender(card,id,s);n.querySelector('input[type=text]')?.focus()};
  nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
  ed.append(el('div',{class:'addrow'},nm,eq,el('button',{type:'button',class:'btn',onclick:add},'Add')));
  ed.append(el('p',{class:'note',style:'text-align:left;margin:0'},'Exercises you add show without a demo. M = machine, C = cable, FW = free weight.'));
  ed.append(el('div',{class:'erow2'},
    el('button',{type:'button',class:'btn',onclick:()=>{delete S.custom[id];S.sel[id]=0;save();rerender(card,id,s)}},'Reset to default'),
    el('button',{type:'button',class:'btn primary',onclick:()=>{editing.delete(id);rerender(card,id,s)}},'Done editing')));
  card.append(ed);return card;
}
function backupBox(){
  const ta=el('textarea',{id:'backup-text','aria-label':'Backup text',spellcheck:'false'});
  return el('details',{class:'backup'},el('summary',{},'Back up or move your data'),
    el('p',{},'Your weights and choices are saved on this phone only. Copy a backup before you clear your browser or switch phones, then paste it here on the new one.'),
    ta,
    el('div',{class:'erow2'},
      el('button',{type:'button',class:'btn',onclick:async()=>{ta.value=JSON.stringify(S);ta.select();try{await navigator.clipboard.writeText(ta.value);toast('Backup copied')}catch(e){toast('Backup selected. Copy it.')}}},'Copy backup'),
      el('button',{type:'button',class:'btn primary',onclick:()=>{try{const j=JSON.parse(ta.value);if(!j||typeof j!=='object'||!('w' in j))throw 0;S=Object.assign(BLANK(),j);if(!S.rec)S.rec={};if(!S.custom)S.custom={};save();render();toast('Backup restored')}catch(e){toast('That doesn\'t look like a backup')}}},'Restore from text')));
}
function logHist(k,w,sets){const t=today();const h=(S.hist[k]=S.hist[k]||[]);const e=sets?[t,w,sets]:[t,w];if(h.length&&h[h.length-1][0]===t)h[h.length-1]=e;else h.push(e);if(h.length>40)h.splice(0,h.length-40)}
function unlogHist(k){const h=S.hist[k];if(h&&h.length&&h[h.length-1][0]===today())h.pop()}
function pruneDone(){const ks=Object.keys(S.done).sort();while(ks.length>14)delete S.done[ks.shift()]}
function finishDay(){
  const w=DATA.week[view];if(w.lift)S.lastDay=w.lift;save();
  const nx=(view+1)%7;toast(DOW_FULL[w.dow]+' done. Next up: '+DOW_FULL[DATA.week[nx].dow]+'.');
  view=nx;render();scrollTo({top:0});
}

fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{DATA=j;render()}).catch(()=>{document.getElementById('main').textContent='Could not load the plan. Reload the page to try again.'});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
